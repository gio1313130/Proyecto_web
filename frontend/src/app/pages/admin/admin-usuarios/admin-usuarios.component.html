<div class="admin-view">
  <div class="header-actions">
    <h2>Gestión de Usuarios</h2>
  </div>

  <div *ngIf="cargando" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando usuarios...</p>
  </div>

  <div *ngIf="!cargando && usuarios.length === 0" class="empty-state">
    <p>No hay usuarios registrados.</p>
  </div>

  <div *ngIf="!cargando && usuarios.length > 0" class="table-responsive">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of usuarios">
          <td class="primary-cell">{{ user.nombreUsuario }}</td>
          <td>{{ user.correo }}</td>
          <td>
            <span class="badge" [ngClass]="{'admin': user.rol === 'ADMIN', 'user': user.rol === 'ALUMNO'}">
              {{ user.rol || 'ALUMNO' }}
            </span>
          </td>
          <td class="actions-cell">
            <button class="btn-icon edit" (click)="abrirModalEditar(user)" title="Editar">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="btn-icon delete" (click)="eliminarUsuario(user.idUsuario || user.id)" title="Eliminar">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Formulario -->
<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Editar Usuario</h3>
      <button class="close-btn" (click)="cerrarModal()">×</button>
    </div>
    <div class="modal-body form-group">
      <label>Nombre Completo</label>
      <input type="text" class="form-control" [(ngModel)]="usuarioActual.nombreUsuario">
      
      <label class="mt-3">Correo Electrónico</label>
      <input type="email" class="form-control" [(ngModel)]="usuarioActual.correo">

      <label class="mt-3">Rol del Sistema</label>
      <select class="form-control" [(ngModel)]="usuarioActual.rol">
        <option value="ALUMNO">Estudiante (ALUMNO)</option>
        <option value="ADMIN">Administrador (ADMIN)</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" (click)="guardarUsuario()" [disabled]="!usuarioActual.nombreUsuario || !usuarioActual.correo">
        Guardar Cambios
      </button>
    </div>
  </div>
</div>
