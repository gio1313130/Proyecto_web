<div class="admin-view">
  <div class="header-actions">
    <h2>Gestión de Temas</h2>
    <div class="filter-group">
      <label for="materiaSelect">Materia:</label>
      <select id="materiaSelect" [(ngModel)]="materiaSeleccionada" (change)="onMateriaChange()" class="form-control">
        <option *ngFor="let m of materias" [value]="m.idMateria">{{ m.nombreMateria || m.nombre_materia }}</option>
      </select>
    </div>
    <button class="btn btn-primary" (click)="abrirModalNuevo()" [disabled]="!materiaSeleccionada">
      + Nuevo Tema
    </button>
  </div>

  <div *ngIf="cargando" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando temas...</p>
  </div>

  <div *ngIf="!cargando && temas.length === 0" class="empty-state">
    <p>No hay temas registrados en esta materia.</p>
  </div>

  <div *ngIf="!cargando && temas.length > 0" class="table-responsive">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Título</th>
          <th>Descripción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tema of temas">
          <td class="primary-cell">{{ tema.nombreTema }}</td>
          <td class="desc-cell">{{ tema.descripcionTema }}</td>
          <td class="actions-cell">
            <button class="btn-icon edit" (click)="abrirModalEditar(tema)" title="Editar">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="btn-icon delete" (click)="eliminarTema(tema.idTema)" title="Eliminar">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Formulario -->
<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>{{ editando ? 'Editar Tema' : 'Nuevo Tema' }}</h3>
      <button class="close-btn" (click)="cerrarModal()">×</button>
    </div>
    <div class="modal-body form-group">
      <label>Título del Tema</label>
      <input type="text" class="form-control" [(ngModel)]="temaActual.nombreTema" placeholder="Ej. Álgebra Básica">
      
      <label class="mt-3">Descripción</label>
      <textarea class="form-control" [(ngModel)]="temaActual.descripcionTema" rows="4" placeholder="Breve descripción del tema..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" (click)="guardarTema()" [disabled]="!temaActual.nombreTema">
        Guardar
      </button>
    </div>
  </div>
</div>
