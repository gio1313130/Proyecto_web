<div class="admin-view">
  <div class="header-actions">
    <h2>Gestión de Recursos</h2>
    
    <div class="filters-container">
      <div class="filter-group">
        <label>Materia:</label>
        <select [(ngModel)]="materiaSeleccionada" (change)="onMateriaChange()" class="form-control">
          <option *ngFor="let m of materias" [value]="m.idMateria">{{ m.nombreMateria || m.nombre_materia }}</option>
        </select>
      </div>

      <div class="filter-group" *ngIf="materiaSeleccionada">
        <label>Tema:</label>
        <select [(ngModel)]="temaSeleccionado" (change)="onTemaChange()" class="form-control">
          <option *ngFor="let t of temas" [value]="t.idTema">{{ t.nombreTema }}</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" (click)="abrirModalNuevo()" [disabled]="!temaSeleccionado">
      + Subir Recurso
    </button>
  </div>

  <div *ngIf="cargando" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando recursos...</p>
  </div>

  <div *ngIf="!cargando && temaSeleccionado && recursos.length === 0" class="empty-state">
    <p>No hay recursos para este tema. ¡Sube el primer PDF o Video!</p>
  </div>

  <div *ngIf="!cargando && recursos.length > 0" class="table-responsive">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Título</th>
          <th>Tipo</th>
          <th>Ruta / Enlace</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let rec of recursos">
          <td class="primary-cell">{{ rec.tituloRecurso }}</td>
          <td>
            <span class="badge type" [ngClass]="rec.tipoRecurso">{{ rec.tipoRecurso }}</span>
          </td>
          <td>
            <a *ngIf="rec.url" [href]="rec.url" target="_blank" class="resource-link">Abrir Enlace</a>
            <span *ngIf="!rec.url">Sin enlace</span>
          </td>
          <td class="actions-cell">
            <button class="btn-icon delete" (click)="eliminarRecurso(rec.idRecurso)" title="Eliminar">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Formulario -->
<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Subir Nuevo Recurso</h3>
      <button class="close-btn" (click)="cerrarModal()">×</button>
    </div>
    <div class="modal-body form-group">
      <label>Título del Recurso</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoRecurso.tituloRecurso" placeholder="Ej. Diapositivas Tema 1">

      <label class="mt-3">Autor</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoRecurso.autor" placeholder="Ej. Juan Pérez">

      <label class="mt-3">Tipo de Recurso</label>
      <select class="form-control" [(ngModel)]="nuevoRecurso.tipoRecurso">
        <option value="PDF">Documento PDF</option>
        <option value="VIDEO">Video de YouTube</option>
      </select>

      <div class="upload-area mt-3" *ngIf="nuevoRecurso.tipoRecurso === 'PDF'">
        <label>Archivo PDF</label>
        <input type="file" class="form-control" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx">
      </div>

      <div class="upload-area mt-3" *ngIf="nuevoRecurso.tipoRecurso === 'VIDEO'">
        <label>Enlace de YouTube</label>
        <input type="url" class="form-control" [(ngModel)]="nuevoRecurso.url" placeholder="https://youtube.com/...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" (click)="guardarRecurso()" [disabled]="!nuevoRecurso.tituloRecurso || guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
