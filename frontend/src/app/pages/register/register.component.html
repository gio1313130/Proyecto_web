<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="var(--color-primary)" stroke="var(--color-primary)" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Crear Cuenta</h2>
      <p>Únete a la Plataforma de Regularización Académica</p>
    </div>

    <form class="login-form">
      <div class="input-group">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" [(ngModel)]="nombreUsuario" name="nombreUsuario" placeholder="Juan Pérez">
      </div>
      
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" [(ngModel)]="correo" name="correo" placeholder="usuario@mail.com">
      </div>
      
      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="passwordUsuario" name="passwordUsuario" required minlength="6" placeholder="••••••••">
      </div>

      <div class="input-group">
        <label for="rol">Rol en la plataforma</label>
        <select id="rol" [(ngModel)]="rol" name="rol" required>
          <option value="ALUMNO">Alumno</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;" (click)="register()">REGISTRARSE</button>
    </form>
    
    <div class="login-footer">
      <span>¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></span>
    </div>
  </div>
</div>
