<div class="admin-wrapper">
  <!-- Sidebar -->
  <aside class="admin-sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
      <div class="logo-icon" *ngIf="!isCollapsed">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="var(--color-primary)" stroke="var(--color-primary)" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 *ngIf="!isCollapsed">Admin Panel</h2>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <svg *ngIf="!isCollapsed" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <svg *ngIf="isCollapsed" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/materias" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span *ngIf="!isCollapsed">Materias</span>
      </a>
      <a routerLink="/admin/temas" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        <span *ngIf="!isCollapsed">Temas</span>
      </a>
      <a routerLink="/admin/recursos" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span *ngIf="!isCollapsed">Recursos</span>
      </a>
      <a routerLink="/admin/cuestionarios" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span *ngIf="!isCollapsed">Cuestionarios</span>
      </a>
      <a routerLink="/admin/usuarios" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span *ngIf="!isCollapsed">Usuarios</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/dashboard" class="nav-item exit-item">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span *ngIf="!isCollapsed">Volver a App</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div class="breadcrumb">
        <span>Administración</span>
      </div>
      <div class="user-profile">
        <div class="avatar">A</div>
        <span class="role-badge">ADMIN</span>
      </div>
    </header>
    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
